# Nginx site config for foodqcheck.drenzzz.dev
# Designed for Cloudflare Flexible SSL — VPS listens on port 80 only.
# Public HTTPS is terminated at Cloudflare; Cloudflare proxies plain HTTP
# to the origin. Do NOT enable HSTS here because the origin connection
# from Cloudflare is HTTP, not HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name foodqcheck.drenzzz.dev;

    # Security headers — applied to all responses including proxied API ones
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Android App Links verification file
    location = /.well-known/assetlinks.json {
        root /var/www/foodqcheck;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Static web app (Vite build output of umkm-food-quality-mobile)
    location / {
        root /opt/foodqcheck/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        root /opt/foodqcheck/web;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Backend API — strip /api prefix and proxy to Gunicorn
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Reject large request bodies and unused methods
    client_max_body_size 15m;

    # Tighten the request method allowlist via map + if — kept simple
    # because /verify-email and /reset-password may receive POST without
    # an /api prefix from native app webviews.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }
}
